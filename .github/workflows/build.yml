name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhitelistFilter-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # גרסה קבועה בשם latest — קל להוריד ישירות מהטלפון
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: גרסה אחרונה
          body: נבנה אוטומטית מ-${{ github.sha }}
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk

      # אם הבנייה נכשלה — הלוג מתפרסם כדי שאפשר יהיה לראות את השגיאה
      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: לוג בנייה אחרונה שנכשלה
          prerelease: true
          make_latest: false
          files: build.log
